server:
  port: 8080

spring:
  application:
    name: java-ai-launchpad-demo

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.4

  # Embedded HSQLDB, used only to persist JDBC-backed chat memory.
  datasource:
    url: jdbc:hsqldb:file:./data/chatmemory;shutdown=true
    driver-class-name: org.hsqldb.jdbc.JDBCDriver
    username: SA
    password:

logging:
  level:
    org.springframework.ai: INFO
