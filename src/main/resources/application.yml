server:
  port: 8080

spring:
  application:
    name: java-ai-launchpad-demo

  ai:
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
          temperature: 0.4
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

  # Embedded HSQLDB, used only to persist JDBC-backed chat memory.
  datasource:
    url: jdbc:hsqldb:file:./data/chatmemory;shutdown=true
    driver-class-name: org.hsqldb.jdbc.JDBCDriver
    username: SA
    password:

logging:
  level:
    org.springframework.ai: INFO
