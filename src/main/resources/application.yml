server:
  port: 8080

spring:
  application:
    name: java-ai-launchpad-demo

  # OpenAI credentials - set OPENAI_API_KEY as an environment variable, never hardcode it
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.4
    vectorstore:
      chroma:
        client:
          host: http://localhost
          port: 8000
        collection-name: ems_hr_policies
        initialize-schema: true
    chat:
      memory:
        repository:
          jdbc:
            # auto-creates the SPRING_AI_CHAT_MEMORY table on startup
            initialize-schema: always

  # Embedded H2 database used only to store JDBC-backed chat memory for the demo.
  # Swap this for Postgres/MySQL in a real deployment.
  datasource:
    url: jdbc:h2:file:./data/chatmemory;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: always

logging:
  level:
    org.springframework.ai: DEBUG
